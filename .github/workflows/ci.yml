name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/native-host/go.mod
          cache: false

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Pandoc
        run: choco install pandoc --yes --no-progress

      - name: Check extension and native host
        run: npm run check:all
